name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 3 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: swift
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        # Klasörlerin içine sırasıyla giriyoruz
        cd Macnitor/macOsdeger/Macnitor
        
        echo "Güncel klasör içeriği:"
        ls -la
        
        echo "Xcode projesi tespit edildi, derleme başlıyor..."
        
        # Önce 'macnitor' (küçük harf) şemasıyla derlemeyi deniyoruz
        if xcodebuild -project macnitor.xcodeproj -scheme macnitor -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO; then
          echo "Derleme küçük harfli şema ile başarılı oldu."
        else
          echo "Küçük harfli şema bulunamadı, 'Macnitor' (Büyük M) şeması deneniyor..."
          xcodebuild -project macnitor.xcodeproj -scheme Macnitor -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
